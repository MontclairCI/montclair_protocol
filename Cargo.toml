[package]
name = "montclair_protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
futures = "0.3.32"
futures-util = { version = "0.3.32", features = ["sink"] }
heapless = "0.9.3"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_derive = "1.0.228"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync", "macros", "rt-multi-thread"] }
tokio-io = "0.1.13"
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.3", features = ["serde", "v7"] }
montclair_plan = { git = "https://github.com/MontclairCI/montclair_plan.git" }
montclair_container = { git = "https://github.com/MontclairCI/montclair_container.git" }
montclair_git = { git = "https://github.com/MontclairCI/montclair_git.git" }
tokio-stream = "0.1.19"
strum = { version = "0.28.0", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["derive"] }

[dev-dependencies]
tracing-test = "0.2.6"

[lib]
name = "montclair_protocol"
path = "src/lib.rs"

[lints.clippy]
new_without_default = "allow"
